openlog_deploy_user: ubuntu
openlog_deploy_group: ubuntu
openlog_deploy_path: /opt/openlog
openlog_authorized_key_files:
  - "{{ playbook_dir }}/../files/openlog-admin.pub"
  - "{{ playbook_dir }}/../files/openlog-production-deploy.pub"
openlog_public_tcp_ports:
  - "80"
  - "443"
openlog_environment: production
grafana_cloud_metrics_url: "{{ lookup('ansible.builtin.env', 'GRAFANA_CLOUD_METRICS_URL') }}"
grafana_cloud_metrics_user: "{{ lookup('ansible.builtin.env', 'GRAFANA_CLOUD_METRICS_USER') }}"
grafana_cloud_logs_url: "{{ lookup('ansible.builtin.env', 'GRAFANA_CLOUD_LOGS_URL') }}"
grafana_cloud_logs_user: "{{ lookup('ansible.builtin.env', 'GRAFANA_CLOUD_LOGS_USER') }}"
grafana_cloud_token: "{{ lookup('ansible.builtin.env', 'GRAFANA_CLOUD_TOKEN') }}"
# GeoLite2 requires an accepted MaxMind license and credentials kept outside Git.
maxmind_account_id: "{{ lookup('ansible.builtin.env', 'MAXMIND_ACCOUNT_ID') }}"
maxmind_license_key: "{{ lookup('ansible.builtin.env', 'MAXMIND_LICENSE_KEY') }}"
geoip_database_directory: /var/lib/alloy/geoip
geoip_database_path: "{{ geoip_database_directory }}/GeoLite2-City.mmdb"
