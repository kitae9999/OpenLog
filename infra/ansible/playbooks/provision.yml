---
- name: Provision OpenLog production VM
  hosts: openlog-production
  become: true
  serial: 1
  force_handlers: true

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("22.04", ">=")
        fail_msg: "OpenLog production provisioning supports Ubuntu 22.04 or newer."

    - name: Verify Grafana Cloud credentials are provided
      ansible.builtin.assert:
        that:
          - grafana_cloud_metrics_url | length > 0
          - grafana_cloud_metrics_user | length > 0
          - grafana_cloud_logs_url | length > 0
          - grafana_cloud_logs_user | length > 0
          - grafana_cloud_token | length > 0
        fail_msg: >-
          Set GRAFANA_CLOUD_METRICS_URL, GRAFANA_CLOUD_METRICS_USER,
          GRAFANA_CLOUD_LOGS_URL, GRAFANA_CLOUD_LOGS_USER, and
          GRAFANA_CLOUD_TOKEN before provisioning.
      no_log: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - acl
          - ca-certificates
          - curl
          - gnupg
          - jq
          - python3-apt
          - rsync
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker APT signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    - name: Install Grafana APT signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Grafana APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/grafana.asc]
          https://apt.grafana.com stable main
        filename: grafana
        state: present
        update_cache: true

    - name: Install Grafana Alloy
      ansible.builtin.apt:
        name: alloy
        state: present

    - name: Restrict Grafana Alloy configuration directory
      ansible.builtin.file:
        path: /etc/alloy
        state: directory
        owner: root
        group: alloy
        mode: "0750"

    - name: Configure Grafana Alloy persistent data directory
      ansible.builtin.file:
        path: /var/lib/alloy
        state: directory
        owner: alloy
        group: alloy
        mode: "0750"

    - name: Configure Docker log rotation
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/docker-daemon.json.j2"
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker

    - name: Enable Docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Add deployment user to Docker group
      ansible.builtin.user:
        name: "{{ openlog_deploy_user }}"
        groups:
          - docker
        append: true

    - name: Add Alloy user to Docker group
      ansible.builtin.user:
        name: alloy
        groups:
          - docker
        append: true

    - name: Configure Grafana Alloy
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/alloy-config.alloy.j2"
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: "0640"

    - name: Configure Grafana Cloud credentials for Alloy
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/alloy-credentials.env.j2"
        dest: /etc/alloy/credentials.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create Alloy systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create containerd systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/containerd.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Preserve Alloy access to the containerd socket
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/containerd-alloy-access.conf.j2"
        dest: /etc/systemd/system/containerd.service.d/10-openlog-alloy-access.conf
        owner: root
        group: root
        mode: "0644"

    - name: Attach Grafana Cloud credentials to Alloy service
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/alloy-systemd-override.conf.j2"
        dest: /etc/systemd/system/alloy.service.d/10-openlog.conf
        owner: root
        group: root
        mode: "0644"

    - name: Install Alloy Docker access refresh command
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/openlog-refresh-alloy-access"
        dest: /usr/local/sbin/openlog-refresh-alloy-access
        owner: root
        group: root
        mode: "0755"

    - name: Allow deployment user to refresh Alloy Docker access
      ansible.builtin.copy:
        content: >-
          {{ openlog_deploy_user }} ALL=(root) NOPASSWD:
          /usr/local/sbin/openlog-refresh-alloy-access
        dest: /etc/sudoers.d/openlog-alloy
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Validate Grafana Alloy configuration
      ansible.builtin.command:
        cmd: /usr/bin/alloy validate /etc/alloy/config.alloy
      environment:
        OPENLOG_ENVIRONMENT: "{{ openlog_environment }}"
        OPENLOG_HOST: "{{ ansible_hostname }}"
        GRAFANA_CLOUD_METRICS_URL: "{{ grafana_cloud_metrics_url }}"
        GRAFANA_CLOUD_METRICS_USER: "{{ grafana_cloud_metrics_user }}"
        GRAFANA_CLOUD_LOGS_URL: "{{ grafana_cloud_logs_url }}"
        GRAFANA_CLOUD_LOGS_USER: "{{ grafana_cloud_logs_user }}"
        GRAFANA_CLOUD_TOKEN: "{{ grafana_cloud_token }}"
      changed_when: false
      no_log: true

    - name: Enable Grafana Alloy service
      ansible.builtin.systemd_service:
        name: alloy
        daemon_reload: true
        enabled: true
        state: started

    - name: Grant Alloy read access to Docker state
      ansible.builtin.command:
        cmd: /usr/local/sbin/openlog-refresh-alloy-access
      changed_when: false

    - name: Create deployment user SSH directory
      ansible.builtin.file:
        path: "/home/{{ openlog_deploy_user }}/.ssh"
        state: directory
        owner: "{{ openlog_deploy_user }}"
        group: "{{ openlog_deploy_group }}"
        mode: "0700"

    - name: Authorize OpenLog administration and deployment keys
      ansible.builtin.lineinfile:
        path: "/home/{{ openlog_deploy_user }}/.ssh/authorized_keys"
        line: "{{ lookup('ansible.builtin.file', item) }}"
        create: true
        owner: "{{ openlog_deploy_user }}"
        group: "{{ openlog_deploy_group }}"
        mode: "0600"
      loop: "{{ openlog_authorized_key_files }}"

    - name: Create OpenLog deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ openlog_deploy_user }}"
        group: "{{ openlog_deploy_group }}"
        mode: "0755"
      loop:
        - "{{ openlog_deploy_path }}"
        - "{{ openlog_deploy_path }}/backups"
        - "{{ openlog_deploy_path }}/nginx"
        - "{{ openlog_deploy_path }}/nginx/certs"

    - name: Deny unsolicited incoming traffic
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing traffic
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH before enabling UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow public OpenLog ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ openlog_public_tcp_ports }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Verify Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show Docker Compose version
      ansible.builtin.debug:
        var: docker_compose_version.stdout

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
