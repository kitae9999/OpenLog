services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=2048MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - openlog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - openlog

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    environment:
      REDIS_ARGS: --protected-mode no --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - openlog-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - openlog

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - openlog-kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - openlog

  debezium:
    image: quay.io/debezium/connect:${DEBEZIUM_CONNECT_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ${DEBEZIUM_CONNECT_GROUP_ID}
      CONFIG_STORAGE_TOPIC: ${DEBEZIUM_CONNECT_CONFIG_STORAGE_TOPIC}
      OFFSET_STORAGE_TOPIC: ${DEBEZIUM_CONNECT_OFFSET_STORAGE_TOPIC}
      STATUS_STORAGE_TOPIC: ${DEBEZIUM_CONNECT_STATUS_STORAGE_TOPIC}
      ADVERTISED_HOST_NAME: debezium
      HEAP_OPTS: ${DEBEZIUM_CONNECT_HEAP_OPTS}
      LOG_LEVEL: ${DEBEZIUM_CONNECT_LOG_LEVEL}
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      CONNECT_TOPIC_CREATION_DEFAULT_REPLICATION_FACTOR: 1
      CONNECT_TOPIC_CREATION_DEFAULT_PARTITIONS: 3
      CONNECT_TOPIC_CREATION_DEFAULT_CLEANUP_POLICY: delete
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME}
      DEBEZIUM_DATABASE_HOSTNAME: ${DEBEZIUM_DATABASE_HOSTNAME}
      DEBEZIUM_DATABASE_PORT: ${DEBEZIUM_DATABASE_PORT}
      DEBEZIUM_DATABASE_USER: ${DEBEZIUM_DATABASE_USER}
      DEBEZIUM_DATABASE_PASSWORD: ${DEBEZIUM_DATABASE_PASSWORD}
      DEBEZIUM_DATABASE_DBNAME: ${DEBEZIUM_DATABASE_DBNAME}
      DEBEZIUM_TOPIC_PREFIX: ${DEBEZIUM_TOPIC_PREFIX}
      DEBEZIUM_SLOT_NAME: ${DEBEZIUM_SLOT_NAME}
      DEBEZIUM_PUBLICATION_NAME: ${DEBEZIUM_PUBLICATION_NAME}
      DEBEZIUM_SNAPSHOT_MODE: ${DEBEZIUM_SNAPSHOT_MODE}
      DEBEZIUM_OUTBOX_TABLE_INCLUDE_LIST: ${DEBEZIUM_OUTBOX_TABLE_INCLUDE_LIST}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - openlog

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ${PRODUCTION_ENV_FILE:-./production.env}
    environment:
      SPRING_PROFILES_ACTIVE: production
    expose:
      - "8080"
      - "9090"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - openlog

  mcp:
    image: ${MCP_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ${PRODUCTION_ENV_FILE:-./production.env}
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8090
      OPENLOG_API_BASE_URL: http://backend:8080/api
      MCP_INTROSPECTION_URL: http://backend:8080/api/oauth2/introspect
      MCP_TOKEN_URL: http://backend:8080/api/oauth2/token
    expose:
      - "8090"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - openlog

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      mcp:
        condition: service_healthy
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/public-routes.conf:/etc/nginx/snippets/openlog-public-routes.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - openlog

volumes:
  openlog-postgres-data:
  openlog-redis-data:
  openlog-kafka-data:

networks:
  openlog:
    name: openlog
