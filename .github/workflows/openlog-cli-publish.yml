name: OpenLog CLI CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "packages/openlog-cli/**"
      - ".github/workflows/openlog-cli-publish.yml"
  push:
    branches:
      - develop
    paths:
      - "packages/openlog-cli/**"
      - ".github/workflows/openlog-cli-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlog-cli-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.detect.outputs.cli }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect CLI package changes
        id: detect
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "cli=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- packages/openlog-cli; then
            echo "cli=false" >> "$GITHUB_OUTPUT"
          else
            echo "cli=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/openlog-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/openlog-cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  publish:
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') || (github.event_name == 'push' && needs.changes.outputs.cli == 'true')
    concurrency:
      group: openlog-cli-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/openlog-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Read package metadata
        id: package
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const packageJson = require('./package.json')
          console.log(`name=${packageJson.name}`)
          console.log(`requested_version=${packageJson.version}`)
          NODE

      - name: Resolve release version
        id: release
        run: |
          set +e
          latest_version=$(npm view "${{ steps.package.outputs.name }}" version 2>/tmp/openlog-cli-view-error.log)
          status=$?
          set -e

          if [ "$status" -ne 0 ] && ! grep -q "E404" /tmp/openlog-cli-view-error.log; then
            cat /tmp/openlog-cli-view-error.log
            exit "$status"
          fi

          if [ "$status" -ne 0 ]; then
            latest_version=""
          fi

          release_version=$(node ./scripts/resolve-release-version.mjs \
            "${{ steps.package.outputs.requested_version }}" \
            "$latest_version")

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved ${{ steps.package.outputs.name }} release version $release_version from requested ${{ steps.package.outputs.requested_version }} and npm latest ${latest_version:-none}."

      - name: Apply release version
        if: steps.release.outputs.version != steps.package.outputs.requested_version
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
